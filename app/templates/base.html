<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}VulnScope{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('index') }}">◈ VulnScope</a><span class="tag">LOCAL SECURITY LAB</span>{% if g.user %}<nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('profile', user_id=g.user['id']) }}">My Profile</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="linkbutton">Logout</button></form></nav>{% endif %}</header><main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>VulnScope • Educational testing on localhost only</footer></body></html>
